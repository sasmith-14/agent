[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pilot"
version = "0.1.0"
description = "A small, observable local agent foundation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "typer>=0.16.1",
  "rich",
  "pyyaml",
]

[project.scripts]
pilot = "pilot.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: opt-in tests requiring a real provider"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]  # Provider-specific REST options are intentionally open-ended JSON.
